<g transform="translate(84,240)">
  <rect x="0" y="0" width="1432" height="540" rx="24" fill="#fff" stroke="#e5d8bc" stroke-width="2"/>
  <line x1="477" y1="0" x2="477" y2="540" stroke="#eadfca" stroke-width="2"/>
  <line x1="954" y1="0" x2="954" y2="540" stroke="#eadfca" stroke-width="2"/>

  <!-- Slim -->
  <text x="238" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="44" fill="#111">Slim Fit</text>
  <text x="238" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#b08945">Sharpest silhouette</text>
  <g transform="translate(145,132)">
    <circle cx="93" cy="28" r="27" fill="#d9c9a7"/>
    <path d="M60 70 L93 52 L126 70 L142 126 L119 136 L109 284 L77 284 L67 136 L44 126 Z" fill="#20242c"/>
