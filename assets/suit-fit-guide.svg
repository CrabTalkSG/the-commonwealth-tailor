  <text x="1193" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5d5449">More room in the chest, waist,</text>
  <text x="1193" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5d5449">arms and pants for a traditional,</text>
  <text x="1193" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#5d5449">comfortable and timeless fit.</text>
</g>
<text x="800" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#7b6d53">TCT helps you choose the right cut before measurements are taken in person.</text>
