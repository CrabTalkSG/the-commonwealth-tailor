  <text x="716" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#f5e7c5">TCT RECOMMENDED DEFAULT</text>

  <!-- Classic -->
  <text x="1193" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="44" fill="#111">Classic Fit</text>
  <text x="1193" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#b08945">Timeless formal comfort</text>
  <g transform="translate(1100,132)">
